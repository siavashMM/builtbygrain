<main class="admin-page-shell">
  <section class="admin-section" aria-labelledby="admin-products-title">
    <div class="admin-topbar">
      <div class="section-heading">
        <p class="eyebrow">Admin</p>
        <h1 id="admin-products-title">Product management</h1>
      </div>
      <div class="admin-session">
        <span>{{ adminUsername }}</span>
        <button type="button" class="secondary-button" (click)="logout()">Sign out</button>
      </div>
    </div>

    @if (message()) {
      <p class="admin-message" [class.error]="actionState() === 'error'">{{ message() }}</p>
    }

    <div class="admin-layout two-column">
      <div>
        <div class="admin-list-header">
          <h2>Saved products</h2>
          <button type="button" class="secondary-button" (click)="loadProducts()">Refresh</button>
        </div>

        <app-admin-product-list
          [products]="products()"
          [state]="productsState()"
          (editProduct)="editProduct($event)"
          (deleteProduct)="deleteProduct($event)"
        />
      </div>

      <div class="admin-editor">
        <app-admin-product-form
          [product]="selectedProduct()"
          [saving]="actionState() === 'saving'"
          (saveProduct)="saveProduct($event)"
          (newProduct)="newProduct()"
        />

        <app-admin-image-upload
          [product]="selectedProduct()"
          (uploaded)="handleImageUploaded($event)"
          (removeImage)="removeImage($event)"
        />
      </div>
    </div>
  </section>
</main>
