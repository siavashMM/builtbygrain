<main class="page-shell">
  <section class="hero" aria-labelledby="page-title">
    <div class="hero-copy">
      <p class="eyebrow">Built by Grain</p>
      <h1 id="page-title">Handcrafted wooden goods, shaped for everyday use.</h1>
      <p class="intro">
        A quiet ecommerce foundation for a German woodworking studio, starting with a connected frontend and backend.
      </p>
    </div>

    <aside class="status-panel" aria-labelledby="backend-status-title">
      <div class="status-header">
        <span class="status-dot" [class.online]="backendState() === 'online'" [class.offline]="backendState() === 'offline'"></span>
        <div>
          <h2 id="backend-status-title">Backend status</h2>
          <p [class.muted]="backendState() === 'checking'">{{ backendStatus() }}</p>
        </div>
      </div>

      <dl>
        <div>
          <dt>Endpoint</dt>
          <dd>/api/health</dd>
        </div>
        <div>
          <dt>Last response</dt>
          <dd>{{ backendTimestamp() ?? 'No response yet' }}</dd>
        </div>
      </dl>

      <button type="button" (click)="refreshBackendStatus()">Refresh</button>
    </aside>
  </section>
</main>
