spring.datasource.url=jdbc:h2:mem:builtbygrain-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.security.admin.username=admin
app.security.admin.password=admin
app.uploads.root=${java.io.tmpdir}/builtbygrain-test-uploads
app.object-storage.provider=filesystem
app.object-storage.filesystem-root=${java.io.tmpdir}/builtbygrain-test-uploads
