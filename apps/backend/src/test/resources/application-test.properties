spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.cache.redis.enabled=false
app.datasource.read-replica.enabled=false
app.security.admin.username=admin
app.security.admin.password=admin
app.uploads.root=${java.io.tmpdir}/builtbygrain-test-uploads
app.object-storage.provider=filesystem
app.object-storage.filesystem-root=${java.io.tmpdir}/builtbygrain-test-uploads
# Keep tests hermetic when a developer's dotenv file contains real integration credentials.
app.oauth.google.client-id=
app.oauth.google.client-secret=
app.oauth.apple.client-id=
app.oauth.apple.client-secret=
app.checkout.google-maps-browser-key=
