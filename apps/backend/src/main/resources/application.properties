spring.application.name=builtbygrain-backend
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/builtbygrain}
spring.datasource.username=${DATABASE_USERNAME:builtbygrain}
spring.datasource.password=${DATABASE_PASSWORD:builtbygrain}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# One-time PostgreSQL admin bootstrap. On startup these values create the account only
# when that username does not exist. Authentication then reads admin_accounts from the DB.
app.security.admin.username=${ADMIN_USERNAME:}
app.security.admin.password=${ADMIN_PASSWORD:}

# Admin sessions are persisted so authentication survives restarts and works across
# multiple application instances. Flyway owns the session schema.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=BBG_ADMIN_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.security.session-cookie-same-site=${SESSION_COOKIE_SAME_SITE:Lax}

# Production is same-origin. Additional exact origins are intended for local clients.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Shared, atomic PostgreSQL rate-limit policies. The edge rejects broad traffic
# spikes; these limits protect identities, reset tokens, and authenticated writes.
app.rate-limit.customer-login-account.attempts=${RATE_LIMIT_CUSTOMER_LOGIN_ACCOUNT_ATTEMPTS:5}
app.rate-limit.customer-login-account.window=${RATE_LIMIT_CUSTOMER_LOGIN_ACCOUNT_WINDOW:15m}
app.rate-limit.customer-login-ip.attempts=${RATE_LIMIT_CUSTOMER_LOGIN_IP_ATTEMPTS:20}
app.rate-limit.customer-login-ip.window=${RATE_LIMIT_CUSTOMER_LOGIN_IP_WINDOW:15m}
app.rate-limit.admin-login-account.attempts=${RATE_LIMIT_ADMIN_LOGIN_ACCOUNT_ATTEMPTS:5}
app.rate-limit.admin-login-account.window=${RATE_LIMIT_ADMIN_LOGIN_ACCOUNT_WINDOW:15m}
app.rate-limit.admin-login-ip.attempts=${RATE_LIMIT_ADMIN_LOGIN_IP_ATTEMPTS:10}
app.rate-limit.admin-login-ip.window=${RATE_LIMIT_ADMIN_LOGIN_IP_WINDOW:15m}
app.rate-limit.registration-ip.attempts=${RATE_LIMIT_REGISTRATION_IP_ATTEMPTS:5}
app.rate-limit.registration-ip.window=${RATE_LIMIT_REGISTRATION_IP_WINDOW:1h}
app.rate-limit.password-reset-request-account.attempts=${RATE_LIMIT_RESET_REQUEST_ACCOUNT_ATTEMPTS:3}
app.rate-limit.password-reset-request-account.window=${RATE_LIMIT_RESET_REQUEST_ACCOUNT_WINDOW:1h}
app.rate-limit.password-reset-request-ip.attempts=${RATE_LIMIT_RESET_REQUEST_IP_ATTEMPTS:10}
app.rate-limit.password-reset-request-ip.window=${RATE_LIMIT_RESET_REQUEST_IP_WINDOW:1h}
app.rate-limit.password-reset-token.attempts=${RATE_LIMIT_RESET_TOKEN_ATTEMPTS:5}
app.rate-limit.password-reset-token.window=${RATE_LIMIT_RESET_TOKEN_WINDOW:15m}
app.rate-limit.password-reset-ip.attempts=${RATE_LIMIT_RESET_IP_ATTEMPTS:10}
app.rate-limit.password-reset-ip.window=${RATE_LIMIT_RESET_IP_WINDOW:15m}
app.rate-limit.admin-write.attempts=${RATE_LIMIT_ADMIN_WRITE_ATTEMPTS:30}
app.rate-limit.admin-write.window=${RATE_LIMIT_ADMIN_WRITE_WINDOW:1m}
app.rate-limit.admin-upload.attempts=${RATE_LIMIT_ADMIN_UPLOAD_ATTEMPTS:10}
app.rate-limit.admin-upload.window=${RATE_LIMIT_ADMIN_UPLOAD_WINDOW:10m}
app.rate-limit.customer-write.attempts=${RATE_LIMIT_CUSTOMER_WRITE_ATTEMPTS:30}
app.rate-limit.customer-write.window=${RATE_LIMIT_CUSTOMER_WRITE_WINDOW:1m}

# Customer browser sessions remain valid for 30 days of inactivity. Password-reset
# tokens are delivered to local Mailpit in development and expire after 30 minutes.
app.customer-auth.session-lifetime=${CUSTOMER_SESSION_LIFETIME:30d}
app.customer-auth.password-reset-lifetime=${PASSWORD_RESET_LIFETIME:30m}
app.customer-auth.password-reset-url=${PASSWORD_RESET_URL:http://localhost:4200/account/reset-password}
app.customer-auth.mail.from=${MAIL_FROM:no-reply@builtbygrain.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

# Optional checkout onboarding integrations. Social providers stay unavailable until
# both credentials are present. GOOGLE_MAPS_BROWSER_KEY is intentionally delivered
# to the browser and must be restricted to the shop's exact HTTP referrers in Google Cloud.
app.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
app.oauth.apple.client-id=${APPLE_OAUTH_CLIENT_ID:}
app.oauth.apple.client-secret=${APPLE_OAUTH_CLIENT_SECRET:}
app.checkout.google-maps-browser-key=${GOOGLE_MAPS_BROWSER_KEY:}

app.uploads.max-file-size-bytes=${PRODUCT_IMAGE_MAX_FILE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=42MB

# Production and local MinIO use the same private S3 API. The filesystem provider
# exists only for isolated tests.
app.object-storage.provider=${OBJECT_STORAGE_PROVIDER:s3}
app.object-storage.endpoint=${OBJECT_STORAGE_ENDPOINT:}
app.object-storage.region=${OBJECT_STORAGE_REGION:eu-central-1}
app.object-storage.bucket=${OBJECT_STORAGE_BUCKET:builtbygrain-media}
app.object-storage.access-key=${OBJECT_STORAGE_ACCESS_KEY:}
app.object-storage.secret-key=${OBJECT_STORAGE_SECRET_KEY:}
app.object-storage.path-style=${OBJECT_STORAGE_PATH_STYLE:false}
app.object-storage.create-bucket=${OBJECT_STORAGE_CREATE_BUCKET:false}
