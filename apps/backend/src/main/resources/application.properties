spring.application.name=builtbygrain-backend
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/builtbygrain}
spring.datasource.username=${DATABASE_USERNAME:builtbygrain}
spring.datasource.password=${DATABASE_PASSWORD:builtbygrain}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
