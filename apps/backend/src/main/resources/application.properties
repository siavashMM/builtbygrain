spring.application.name=builtbygrain-backend
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/builtbygrain}
spring.datasource.username=${DATABASE_USERNAME:builtbygrain}
spring.datasource.password=${DATABASE_PASSWORD:builtbygrain}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# One-time PostgreSQL admin bootstrap. On startup these values create the account only
# when that username does not exist. Authentication then reads admin_accounts from the DB.
app.security.admin.username=${ADMIN_USERNAME:}
app.security.admin.password=${ADMIN_PASSWORD:}

app.uploads.root=${UPLOADS_ROOT:uploads}
app.uploads.max-file-size-bytes=${PRODUCT_IMAGE_MAX_FILE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=42MB
